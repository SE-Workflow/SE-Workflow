{% extends "base.html" %}

{% block body_class %}page-message{% endblock %}
{% block title %}{{ title }} · SE Workflow Studio{% endblock %}

{% block content %}
<main class="message-page">
  <p class="eyebrow">提示</p>
  <h1>{{ title }}</h1>
  <p class="lede">{{ message }}</p>
  <div class="message-actions">
    <a class="btn-primary" href="{{ url_for('index') }}">回到工作台 →</a>
    <a class="btn-ghost" href="{{ url_for('settings_page') }}">查看设置</a>
  </div>
</main>
{% endblock %}
